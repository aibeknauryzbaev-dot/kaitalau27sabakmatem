.a{position:absolute}
.hit{position:absolute;cursor:pointer;border-radius:60px;border:0;background:transparent;font-family:inherit}
#start{left:625px;top:560px;width:580px;height:215px}
#start:hover{box-shadow:0 0 0 8px rgba(255,255,255,.7),0 0 50px 10px rgba(255,255,160,.8)}
#start:active{background:rgba(0,0,0,.12)}
.hit:not(.slot):hover{box-shadow:0 0 0 6px rgba(255,255,255,.75)}
.hit:disabled{cursor:default;background:rgba(255,255,255,.55);box-shadow:none}
.ttl{left:495px;top:42px;width:570px;height:92px;display:flex;align-items:center;justify-content:center;font-size:33px;font-weight:900;color:#5a2d0a;white-space:nowrap}
.dot{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;font-size:38px;font-weight:900;color:#1c5fb8;background:#e4f1ff;border:4px solid #bcd9f5}
.dot.cur{background:#ffd23c;color:#7a3d00;border-color:#f2a900;transform:scale(1.15)}
.dot.ok{background:#35c24f;color:#fff;border-color:#1e9a36}
.dot.bad{background:#ff8a3c;color:#fff;border-color:#d9501a}
#q{left:420px;top:180px;width:700px;height:165px;font-size:40px;line-height:1.25;font-weight:800;color:#243b55;display:flex;align-items:center}
#q.big{font-size:84px;justify-content:center;width:700px}
#fb{left:410px;top:350px;width:710px;height:150px;border-radius:26px;padding:8px 22px;display:none}
#fb.ok{display:block;background:rgba(222,248,226,.97);border:5px solid #2fbf4a}
#fb.bad{display:block;background:rgba(255,238,224,.97);border:5px solid #ee6a2b}
#fb b{font-size:34px;display:block}#fb.ok b{color:#1a8a32}#fb.bad b{color:#d34a14}
#fb span{font-size:26px;line-height:1.2;color:#243b55;font-weight:700;display:block}
.slot{height:135px;top:515px;border:0;border-radius:40px;background:transparent;cursor:pointer;font-family:inherit}
.slot .l{position:absolute;left:10px;top:23px;width:90px;height:90px;display:grid;place-items:center;font-size:48px;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.3)}
.slot .t{position:absolute;left:115px;right:10px;top:0;height:135px;display:flex;align-items:center;font-size:44px;font-weight:900;color:#243b55;text-align:left}
.slot:hover{box-shadow:0 0 0 6px rgba(255,255,255,.8)}
.slot.sel{background:rgba(45,123,229,.18);box-shadow:0 0 0 7px #2d7be5}
.slot.ok{background:rgba(47,191,74,.35);box-shadow:0 0 0 8px #2fbf4a}
.slot.bad{background:rgba(238,106,43,.35);box-shadow:0 0 0 8px #ee6a2b}
.slot.dis{cursor:default}
.bt{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;line-height:1.05;pointer-events:none;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35)}
#modal{display:none;position:absolute;inset:0;background:rgba(255,248,220,.82)}
#modal.on{display:block}
#box{position:absolute;left:386px;top:230px;width:900px;height:500px;background:#fffdf0;border:14px solid #b8793a;border-radius:50px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
#box h1{font-size:92px;color:#1c9a3a;margin-top:50px}
#box p{font-size:42px;color:#243b55;font-weight:800;margin-top:12px}
.mb{position:absolute;bottom:50px;height:110px;width:380px;border:0;border-radius:60px;color:#fff;font:900 40px inherit;font-family:inherit;cursor:pointer;box-shadow:0 8px 0 rgba(0,0,0,.25)}
.mb:active{transform:translateY(6px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
</style></head><body>
<div id="stage">
 <div id="home" class="screen on"><button class="hit" id="start" aria-label="Бастау"></button></div>
 <div id="task" class="screen">
  <div class="a ttl" id="ttl"></div>
  <div id="dots"></div>
  <div class="a" id="q"></div>
  <div class="a" id="fb"></div>
  <div id="opts"></div>
  <button class="hit" id="prev" style="left:305px;top:788px;width:292px;height:98px"></button>
  <div class="a bt" style="left:395px;top:788px;width:195px;height:98px;font-size:33px">Алдыңғы<br>тапсырма</div>
  <button class="hit" id="chk" style="left:640px;top:748px;width:418px;height:138px"></button>
  <div class="a bt" style="left:780px;top:748px;width:270px;height:138px;font-size:44px">Жауапты<br>тексеру</div>
  <button class="hit" id="next" style="left:1102px;top:788px;width:316px;height:98px"></button>
  <div class="a bt" id="nt" style="left:1205px;top:788px;width:205px;height:98px;font-size:33px;color:#6b3a00;text-shadow:0 1px 0 rgba(255,255,255,.5)"></div>
  <div id="modal"><div id="box"><h1>Жарайсыңдар!</h1><p>Бес тапсырманы да орындадыңдар</p>
   <button class="mb" id="again" style="left:50px;background:#1db3d6">↻ Қайталап орындау</button>
   <button class="mb" id="home2" style="right:50px;background:#ee4f6b;width:340px">🏠 Басты бет</button></div></div>
 </div>
</div>
<script>
const T=[
{t:"Мәтінді есеп",q:"Ағам 11 жаста, ал қарындасым 6 жаста. Ағам қарындасынан неше жас үлкен?",o:["5 жас","17 жас","6 жас"],a:0,e:"11 − 6 = 5. «Неше жас үлкен?» дегенде айырмасын табу үшін азайтамыз."},
{t:"Мәтінді есеп",q:"Ағам 29 жаста, ал әпкем одан 5 жас үлкен. Әпкем неше жаста?",o:["24 жас","34 жас","35 жас"],a:1,e:"29 + 5 = 34. Әпкесі 5 жас үлкен болғандықтан, қосу амалын қолданамыз."},
{t:"Теңдеуді шеш",q:"x − 13 = 38",o:["25","51","41"],a:1,e:"x = 38 + 13 = 51."},
{t:"Салыстыру есебі",q:"Қалада 25 досым бар, ал ауылда 17 досым бар. Ауылдағы достарым қаладағы достарымнан нешеуі кем?",o:["8 дос","42 дос","12 дос"],a:0,e:"25 − 17 = 8. Ауылдағы достар саны 8-ге кем."},
{t:"Өрнектің мәнін тап",q:"22 + 17 + 38 + 23",o:["90","100","110"],a:1,e:"Тиімді тәсілмен топтастырамыз: (22 + 38) + (17 + 23) = 60 + 40 = 100."}];
const SX=[[345,322],[678,318],[1005,323]],DC=[1211,1305,1397,1488,1580],DOT=['#e8283f','#1a6fe0','#f5a300'];
let i=0,sel=[],done=[];
const $=id=>document.getElementById(id);
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));$(id).classList.add('on');$('modal').classList.remove('on')}
function fit(){const s=Math.min(innerWidth/1672,innerHeight/941);$('stage').style.transform=`translate(-50%,-50%) scale(${s})`}
addEventListener('resize',fit);fit();
function render(){
 const d=T[i];show('task');
 $('ttl').textContent=`${i+1}-тапсырма · ${d.t}`;
 $('dots').innerHTML=DC.map((x,k)=>{const c=k==i?'cur':done[k]?(sel[k]===T[k].a?'ok':'bad'):'';return `<div class="a dot ${c}" style="left:${x-37}px;top:30px">${k+1}</div>`}).join('');
 const q=$('q');q.textContent=d.q;q.className='a'+(d.q.length<16?' big':'');
 $('opts').innerHTML='';
 d.o.forEach((x,k)=>{const b=document.createElement('button');b.className='a slot';b.style.left=SX[k][0]+'px';b.style.width=SX[k][1]+'px';
  b.innerHTML=`<span class="l">${'ABC'[k]}</span><span class="t">${x}</span>`;
  if(sel[i]===k)b.classList.add('sel');
  if(done[i]){b.classList.add('dis');if(k===d.a){b.className+=' ok';b.classList.remove('sel')}else if(k===sel[i]){b.className+=' bad';b.classList.remove('sel')}}
  b.onclick=()=>{if(done[i])return;sel[i]=k;render()};$('opts').appendChild(b)});
 $('prev').disabled=i==0;$('chk').disabled=sel[i]==null||!!done[i];
 $('nt').innerHTML=i==4?'Аяқтау':'Келесі<br>тапсырма';
 const f=$('fb');
 if(done[i]){const ok=sel[i]===d.a;f.className='a '+(ok?'ok':'bad');
  f.innerHTML=`<b>${ok?'✔ Жарайсың! Дұрыс жауап!':'✖ Қайта ойланып көр!'}</b><span>${ok?'':'Дұрыс жауап: '+d.o[d.a]+'. '}💡 ${d.e}</span>`}
 else f.className='a';
}
$('start').onclick=()=>{i=0;sel=[];done=[];render()};
$('chk').onclick=()=>{done[i]=true;render()};
$('next').onclick=()=>{if(i<4){i++;render()}else $('modal').classList.add('on')};
$('prev').onclick=()=>{if(i>0){i--;render()}};
$('again').onclick=$('start').onclick;
$('home2').onclick=()=>show('home');
</script></body></html>
